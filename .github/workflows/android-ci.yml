# Android CI — lint, analyze, test, and build a debug APK on every push/PR.
# Uses GitHub Actions' 1x-cost Linux runner (not macOS) per BLUEPRINT.md §2.4 —
# iOS builds are intentionally routed to Codemagic (see codemagic.yaml) instead of this runner.
#
# Activates once `apps/mobile` exists (run `flutter create` there per README.md §Setup).
name: Android CI

on:
  push:
    branches: [main]
    paths: ["apps/mobile/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/android-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/mobile

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env is gitignored (real credentials never live in the repo) but pubspec.yaml declares
      # it as a required asset — write the real values from repo secrets so the debug APK
      # actually authenticates against Supabase, not just compiles.
      - name: Write .env from secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-platform-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
